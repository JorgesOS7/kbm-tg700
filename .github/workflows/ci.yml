name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 pyflakes3

      - name: Lint
        run: pyflakes3 kbm_tg700 tests tools

      - name: Testes
        run: python3 -m unittest discover -s tests -v

      - name: Importar a interface
        run: python3 -c "import kbm_tg700.app"

      - name: Gerar .deb
        run: ./build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
