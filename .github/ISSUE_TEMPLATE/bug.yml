name: Problema
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: dropdown
    id: model
    attributes:
      label: Modelo do teclado
      options: [TG700, TG600, TG600W, Outro]
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribuição e versão
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do app
      placeholder: 1.0.1 (menu > Sobre)
  - type: textarea
    id: lsusb
    attributes:
      label: Saída de `lsusb | grep 4a4c`
      render: text
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Passos para reproduzir, o que esperava e o que aconteceu. Para problemas de tecla, diga o que aparece na aba "Testar teclas".
    validations:
      required: true
